# ───────────────────────────────────────────────────────────────────────
#  Kimina 主頁設置 (Windows Terminal / PowerShell Edition)
# ───────────────────────────────────────────────────────────────────────

[profile]
github = "KiminaNatsuki"  # GitHub 用戶名，用來抓取統計數據
user = "Kimina"          # 提示符裡顯示的名字 (PS C:\Users\Kimina>)
banner = "KIMINA"        # 頂部 ASCII 大字

# ── 頂部終端 ───────────────────────────────────────────────────────────
[header]
title = "Kimina@KiminaOS-Windows: ~ (pwsh)"
alt = "Kimina terminal banner"
subtitle = "[teal]Possibly doing random things[/] [overlay1]·[/] Taiwan (R.O.C.) [overlay1]·[/] [pink](*ﾟ▽ﾟ*)[/]"

[[header.commands]]
cmd = 'Write-Host "重音テト最高！" -ForegroundColor Magenta'
output = ["[pink]>> 重音テト最高！ ( •̀ω•́ )✧[/]"]
bar = "pink"  # 輸出左側的豎線顏色

[[header.commands]]
cmd = "git commit -m \"Merge branch 'main' of TFR-ROC\""
output = ["[[main [yellow]8795f93[/]] Merge branch 'main' of TFR-ROC · [green]+1,130[/] / [red]-2,378[/]"]

# ── fastfetch 卡片 ────────────────────────────────────────────────────
[neofetch]
installed = 2025-12-13  # 右上角 "up N days" 從這天算起
about = [
  ["OS", "Windows 11 IoT Enterprise LTSC (24H2)"],
  ["Build", "26100.9711 [overlay1]· installed 2025/12/13[/]"],
  ["Host", "KiminaOS-Windows"],
  ["Shell", "pwsh 7.4.x [overlay1]· Windows Terminal[/]"],
  ["Bio", "平常都「很閒」的台灣人 [overlay1](zh-TW / EN)[/]"],
]
exclude_repos = ["KiminaNatsuki"]

# ── 技能 (dir ~\skills) ────────────────────────────────────────────────
[skills]
files = [
  ["main.py", "yellow", "Python"],
  ["app.ts", "teal", "TypeScript"],
  ["Main.java", "red", "Java"],
  ["model.ampl", "mauve", "AMPL"],
  ["index.html", "peach", "HTML"],
  ["style.css", "blue", "CSS"],
]

# ── 頁尾 ───────────────────────────────────────────────────────────────
[footer]
alt = "掰掰～ See you next time! (・ω・)ノ"
lines = [
  "[pink b]掰掰～[/] See you next time! (・ω・)ノ",
  "# KiminaOS-Windows · drawn with Catppuccin Mocha & ♡",
]

# ── 徽章 ───────────────────────────────────────────────────────────────
[[badges]]
name = "teto"
label = "vocalsynth"
value = "重音テト (0401)"
color = "pink"

[[badges]]
name = "os"
label = "Windows 11"
value = "IoT LTSC 24H2"
color = "blue"

[[badges]]
name = "locale"
label = "Taiwan (R.O.C.)"
value = "zh-TW / EN"
color = "teal"
